<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Калькулятор Т-счетов и Синтетика</title>
  <link href="tailwind.css" rel="stylesheet">
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 3px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    .t-account-row { display: grid; grid-template-columns: 1fr 1fr; }
    .t-cell { padding: 0.6rem 0.8rem; font-size: 0.95rem; display: flex; align-items: center; justify-content: inherit; }
    .t-cell-debit { border-right: 2px solid #334155; justify-content: flex-end; }
    .t-cell-credit { justify-content: flex-start; }

    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    .tab-active { background-color: #2563eb; color: white; border-color: #2563eb; }
    .tab-inactive { background-color: white; color: #64748b; border-color: #cbd5e1; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen py-6 px-4 flex justify-center items-start">

  <main class="w-full max-w-lg md:max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200 mb-10">
    <header class="bg-gradient-to-r from-blue-700 to-blue-600 text-white p-5 text-center shadow-md">
      <h1 class="text-xl font-bold tracking-tight">БухКальк</h1>
    </header>

    <!-- Навигация (Табы) -->
    <div class="flex border-b border-slate-200 bg-slate-50 p-1 gap-1">
      <button id="tabCalc" class="flex-1 py-2 px-4 rounded-lg text-sm font-semibold transition border border-transparent tab-active" onclick="switchTab('calc')">
        Калькулятор самолетиков
      </button>
      <button id="tabTable" class="flex-1 py-2 px-4 rounded-lg text-sm font-semibold transition border border-transparent tab-inactive" onclick="switchTab('table')">
        Синтетическая таблица
      </button>
    </div>

    <!-- Вью: Калькулятор -->
    <div id="viewCalc" class="p-5 space-y-5">
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-1">
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Тип счета</label>
          <div class="flex items-center gap-2">
            <select id="accType" class="flex-1 border border-slate-300 rounded-lg px-3 py-2.5 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none transition text-sm disabled:opacity-60 disabled:cursor-not-allowed disabled:bg-slate-100">
              <option value="active">Активный (+)</option>
              <option value="passive">Пассивный (-)</option>
            </select>
            <label class="flex items-center gap-1.5 cursor-pointer select-none" title="Разрешить ручной выбор типа">
              <input type="checkbox" id="manualToggle" class="sr-only peer">
              <div class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:bg-blue-600 relative transition-colors duration-200">
                <div class="w-4 h-4 bg-white rounded-full shadow-sm absolute top-0.5 left-0.5 transition-transform duration-200 peer-checked:translate-x-full"></div>
              </div>
              <span class="text-xs text-slate-500 font-medium">Ручной</span>
            </label>
          </div>
        </div>
        <div class="col-span-1">
          <label class="block text-sm font-medium text-slate-700 mb-1.5">Номер счета</label>
          <input type="text" inputmode="numeric" id="accNumber" placeholder="Авто-выбор типа" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Сальдо начальное (Сн)</label>
        <input type="text" inputmode="numeric" id="openingBalance" placeholder="0.00" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition font-mono text-lg" oninput="formatInput(this)">
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex flex-col h-60">
          <div class="flex justify-between items-center mb-2 shrink-0">
            <span class="text-sm font-semibold text-blue-700 flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-blue-500"></span> Дебет
            </span>
            <button onclick="addOperationRow('debit')" class="text-xs bg-blue-100 hover:bg-blue-200 text-blue-700 px-2 py-1 rounded transition font-medium">+ Добавить</button>
          </div>
          <div id="debitList" class="space-y-2 overflow-y-auto custom-scroll pr-1 flex-grow"></div>
        </div>

        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex flex-col h-60">
          <div class="flex justify-between items-center mb-2 shrink-0">
            <span class="text-sm font-semibold text-red-700 flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-red-500"></span> Кредит
            </span>
            <button onclick="addOperationRow('credit')" class="text-xs bg-red-100 hover:bg-red-200 text-red-700 px-2 py-1 rounded transition font-medium">+ Добавить</button>
          </div>
          <div id="creditList" class="space-y-2 overflow-y-auto custom-scroll pr-1 flex-grow"></div>
        </div>
      </div>

      <div class="flex gap-3 pt-2">
        <button id="calcBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-semibold py-3 px-4 rounded-lg shadow-lg shadow-blue-200 transition">
          Рассчитать
        </button>
        <button id="resetBtn" class="flex-shrink-0 bg-white hover:bg-slate-50 border border-slate-300 text-slate-600 font-medium py-3 px-4 rounded-lg transition" title="Очистить поля ввода">
          Сброс
        </button>
      </div>
    </div>

    <!-- Вью: Таблица -->
    <div id="viewTable" class="hidden">
      <div class="overflow-x-auto w-full custom-scroll">
        <table class="w-full text-sm text-left text-slate-600">
          <thead class="text-xs text-slate-700 uppercase bg-slate-100 border-b border-slate-300">
            <tr>
              <th class="px-2 py-3 border-r border-slate-300">Код</th>
              <th class="px-2 py-3 border-r border-slate-300 min-w-[120px]">Наименование</th>
              <th class="px-2 py-3 bg-blue-50/50 text-center border-r border-slate-300">Ост. Нч<br>Дебет</th>
              <th class="px-2 py-3 bg-blue-50/50 text-center border-r border-slate-300">Ост. Нч<br>Кредит</th>
              <th class="px-2 py-3 bg-purple-50/50 text-center border-r border-slate-300">Оборот<br>Дебет</th>
              <th class="px-2 py-3 bg-purple-50/50 text-center border-r border-slate-300">Оборот<br>Кредит</th>
              <th class="px-2 py-3 bg-green-50/50 text-center border-r border-slate-300">Ост. Кон<br>Дебет</th>
              <th class="px-2 py-3 bg-green-50/50 text-center">Ост. Кон<br>Кредит</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Rows generated by JS -->
          </tbody>
        </table>
      </div>
      <p class="text-xs text-slate-400 text-center py-2 px-4 italic">
        * Данные обновляются автоматически при расчете в калькуляторе.
      </p>
    </div>

    <!-- Результат Т-счета -->
    <div id="resultSection" class="hidden bg-slate-50 border-t border-slate-200 p-5">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-bold text-slate-800">Результат</h2>
        <span id="accTypeLabel" class="text-xs font-medium px-2 py-1 bg-blue-100 text-blue-700 rounded">Активный</span>
      </div>

      <div class="bg-white rounded-xl shadow-sm border border-slate-300 overflow-hidden">
        <div class="bg-slate-100 border-b-2 border-slate-800 py-2 px-4 text-center">
          <span class="text-sm text-slate-500 font-medium mr-1">Счет</span>
          <span id="resAccNum" class="text-lg font-bold text-slate-800">10</span>
        </div>

        <div class="t-account-row bg-slate-50 border-b border-slate-300">
          <div id="subDebit" class="t-cell t-cell-debit text-blue-800 font-bold text-sm">Дебет (+)</div>
          <div id="subCredit" class="t-cell t-cell-credit text-red-800 font-bold text-sm">Кредит (-)</div>
        </div>

        <div id="resGrid" class="divide-y divide-slate-200"></div>
      </div>

      <div class="mt-3 text-center">
        <p class="text-xs text-slate-500 bg-white inline-block px-3 py-1 rounded-full shadow-sm border border-slate-200">
          <span id="formulaText"></span>
        </p>
      </div>
    </div>
  </main>

  <script>
    const formatter = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2, minimumFractionDigits: 0 });
    const debitListEl = document.getElementById('debitList');
    const creditListEl = document.getElementById('creditList');
    const resGrid = document.getElementById('resGrid');
    const resultSection = document.getElementById('resultSection');
    const accTypeEl = document.getElementById('accType');
    const accNumberEl = document.getElementById('accNumber');
    const manualToggle = document.getElementById('manualToggle');
    const tableBody = document.getElementById('tableBody');

    let accountRegistry = {};

    const activeAccounts = ['01', '03', '04', '07', '08', '09', '10', '11', '19', '20', '21', '23', '25', '26', '28', '29', '41', '43', '44', '45', '46', '50', '51', '52', '55', '57', '58', '81', '94', '97'];
    const passiveAccounts = ['02', '05', '42', '59', '60', '63', '66', '67', '68', '69', '70', '77', '80', '82', '83', '84', '96', '98'];

    window.addEventListener('DOMContentLoaded', () => {
      addOperationRow('debit');
      addOperationRow('credit');
      accTypeEl.disabled = true;
      renderTable();
    });

    function switchTab(mode) {
      const btnCalc = document.getElementById('tabCalc');
      const btnTable = document.getElementById('tabTable');
      const viewCalc = document.getElementById('viewCalc');
      const viewTable = document.getElementById('viewTable');

      if (mode === 'calc') {
        btnCalc.className = 'flex-1 py-2 px-4 rounded-lg text-sm font-semibold transition border border-transparent tab-active';
        btnTable.className = 'flex-1 py-2 px-4 rounded-lg text-sm font-semibold transition border border-transparent tab-inactive';
        viewCalc.classList.remove('hidden');
        viewTable.classList.add('hidden');
      } else {
        btnTable.className = 'flex-1 py-2 px-4 rounded-lg text-sm font-semibold transition border border-transparent tab-active';
        btnCalc.className = 'flex-1 py-2 px-4 rounded-lg text-sm font-semibold transition border border-transparent tab-inactive';
        viewTable.classList.remove('hidden');
        viewCalc.classList.add('hidden');
        renderTable();
      }
    }

    function triggerAutoDetect(value) {
      if (manualToggle.checked) return;
      const raw = value.replace(/\D/g, '');
      if (!raw) return;
      const code = raw.padStart(2, '0');

      if (activeAccounts.includes(code)) accTypeEl.value = 'active';
      else if (passiveAccounts.includes(code)) accTypeEl.value = 'passive';
    }

    accNumberEl.addEventListener('input', (e) => triggerAutoDetect(e.target.value));
    manualToggle.addEventListener('change', () => {
      accTypeEl.disabled = !manualToggle.checked;
      if (!manualToggle.checked) triggerAutoDetect(accNumberEl.value);
    });

    function formatInput(input) {
      const start = input.selectionStart;
      const originalLength = input.value.length;

      let val = input.value.replace(/[^\d.,]/g, '').replace(/,/g, '.');
      if (!val) { input.value = ''; return; }

      const parts = val.split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      input.value = val.endsWith('.') ? parts[0] + '.' : parts.length > 1 ? parts[0] + '.' + parts[1].slice(0, 2) : parts[0];

      const newLength = input.value.length;
      let newPos = start + (newLength - originalLength);
      if (newPos < 0) newPos = 0;
      if (newPos > newLength) newPos = newLength;
      input.setSelectionRange(newPos, newPos);
    }

    function addOperationRow(type) {
      const container = type === 'debit' ? debitListEl : creditListEl;
      const row = document.createElement('div');
      row.className = 'input-row flex gap-2 items-center bg-white p-2 rounded border border-slate-200 shadow-sm';
      row.innerHTML = `
        <input type="text" inputmode="numeric" placeholder="Сумма" class="w-full bg-transparent outline-none font-mono text-sm text-slate-700 placeholder:text-slate-300" oninput="formatInput(this)" onkeydown="handleEnter(event, '${type}')">
        <button class="p-1.5 rounded text-slate-300 hover:text-red-500 hover:bg-red-50 transition" onclick="removeRow(this)" title="Удалить">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
        </button>
      `;
      container.appendChild(row);
      row.querySelector('input').focus();
    }

    function removeRow(btn) {
      const container = btn.closest('#debitList, #creditList');
      const row = btn.closest('.input-row');
      if (container.children.length > 1) row.remove();
      else row.querySelector('input').value = '';
    }

    function handleEnter(e, type) {
      if (e.key === 'Enter') { e.preventDefault(); addOperationRow(type); }
    }

    function getValues(container) {
      return Array.from(container.querySelectorAll('input'))
        .map(inp => parseFloat(inp.value.replace(/\s/g, '')))
        .filter(val => !isNaN(val) && val !== 0);
    }

    function saveToRegistry(code, type, sn, od, ok, sk) {
      if (!code) return;
      const normCode = code.replace(/\s/g, '').padStart(2, '0');

      if (!accountRegistry[normCode]) {
        accountRegistry[normCode] = {
          name: `Счет ${normCode}`,
          type: type,
          sn: 0, od: 0, ok: 0, sk: 0
        };
      }

      const acc = accountRegistry[normCode];
      acc.type = type;
      acc.sn = sn;
      acc.od = od;
      acc.ok = ok;
      acc.sk = sk;
    }

    function renderResult(accType, accNum, sn, debitOps, creditOps, od, ok, sk) {
      const isPassive = accType === 'passive';
      document.getElementById('resAccNum').textContent = accNum || '—';
      document.getElementById('accTypeLabel').textContent = isPassive ? 'Пассивный' : 'Активный';
      document.getElementById('accTypeLabel').className = `text-xs font-medium px-2 py-1 rounded ${isPassive ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`;

      document.getElementById('subDebit').textContent = `Дебет (${isPassive ? '-' : '+'})`;
      document.getElementById('subCredit').textContent = `Кредит (${isPassive ? '+' : '-'})`;

      resGrid.innerHTML = '';

      const createRow = (contentD, contentC, rowClass = '', cellClass = 'text-slate-700') => {
        const row = document.createElement('div');
        row.className = `t-account-row ${rowClass}`;
        row.innerHTML = `
          <div class="t-cell t-cell-debit ${cellClass}">${contentD}</div>
          <div class="t-cell t-cell-credit ${cellClass}">${contentC}</div>
        `;
        resGrid.appendChild(row);
      };

      if (sn !== 0) {
        const snText = `<span class="text-slate-500 text-xs mr-1">Сн =</span> <span class="font-semibold">${formatter.format(sn)}</span>`;
        if (!isPassive) createRow(snText, '', '', 'text-slate-700');
        else createRow('', snText, '', 'text-slate-700');
      }

      const maxLen = Math.max(debitOps.length, creditOps.length);
      for (let i = 0; i < maxLen; i++) {
        const d = i < debitOps.length ? formatter.format(debitOps[i]) : '';
        const c = i < creditOps.length ? formatter.format(creditOps[i]) : '';
        createRow(d, c, '', 'text-slate-700 font-mono');
      }

      const odText = `<span class="text-blue-700 font-bold">Од = ${formatter.format(od)}</span>`;
      const okText = `<span class="text-red-700 font-bold">Ок = ${formatter.format(ok)}</span>`;
      createRow(odText, okText, 'bg-blue-50/50 border-t border-slate-300 mt-1', 'text-slate-800 font-bold');

      const skVal = formatter.format(sk);
      const skLabel = `<span class="text-green-700 font-extrabold text-lg">Ск = ${skVal}</span>`;

      if (!isPassive) createRow(skLabel, '', 'bg-green-50/60 mt-2 border-t-2 border-slate-400', 'text-slate-800');
      else createRow('', skLabel, 'bg-green-50/60 mt-2 border-t-2 border-slate-400', 'text-slate-800');

      document.getElementById('formulaText').textContent = isPassive
        ? `Ск = Сн + Ок - Од = ${formatter.format(sn)} + ${formatter.format(ok)} - ${formatter.format(od)} = ${formatter.format(sk)}`
        : `Ск = Сн + Од - Ок = ${formatter.format(sn)} + ${formatter.format(od)} - ${formatter.format(ok)} = ${formatter.format(sk)}`;

      resultSection.classList.remove('hidden');
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function renderTable() {
      tableBody.innerHTML = '';
      for (let i = 1; i <= 99; i++) {
        const code = i.toString().padStart(2, '0');
        const data = accountRegistry[code] || { name: '', type: 'active', sn: 0, od: 0, ok: 0, sk: 0 };

        const isPopulated = data.od !== 0 || data.ok !== 0 || data.sn !== 0;
        const rowClass = isPopulated ? 'bg-white' : 'bg-slate-50/50';

        const snDr = data.type === 'active' ? (data.sn !== 0 ? formatter.format(data.sn) : '') : '';
        const snCr = data.type === 'passive' ? (data.sn !== 0 ? formatter.format(data.sn) : '') : '';

        const odVal = data.od !== 0 ? formatter.format(data.od) : '';
        const okVal = data.ok !== 0 ? formatter.format(data.ok) : '';

        const skDr = data.type === 'active' ? (data.sk !== 0 ? formatter.format(data.sk) : '') : '';
        const skCr = data.type === 'passive' ? (data.sk !== 0 ? formatter.format(data.sk) : '') : '';

        const row = document.createElement('tr');
        row.className = `border-b border-slate-200 hover:bg-blue-50 transition ${rowClass}`;
        row.innerHTML = `
          <td class="px-2 py-2 font-mono font-bold text-slate-500 border-r border-slate-300">${code}</td>
          <td class="px-2 py-2 border-r border-slate-300">
            <input type="text" value="${data.name}" class="w-full bg-transparent text-sm outline-none focus:bg-white focus:ring-1 focus:ring-blue-300 rounded px-1"
                   onchange="updateName('${code}', this.value)" placeholder="Название...">
          </td>
          <td class="px-2 py-2 text-right font-mono text-xs border-r border-slate-300 ${data.type === 'active' ? 'font-semibold text-slate-700' : 'text-slate-400'}">${snDr}</td>
          <td class="px-2 py-2 text-right font-mono text-xs border-r border-slate-300 ${data.type === 'passive' ? 'font-semibold text-slate-700' : 'text-slate-400'}">${snCr}</td>
          <td class="px-2 py-2 text-right font-mono text-xs font-medium text-blue-700 border-r border-slate-300">${odVal}</td>
          <td class="px-2 py-2 text-right font-mono text-xs font-medium text-red-700 border-r border-slate-300">${okVal}</td>
          <td class="px-2 py-2 text-right font-mono text-xs font-bold text-green-700 border-r border-slate-300 bg-green-50/20">${skDr}</td>
          <td class="px-2 py-2 text-right font-mono text-xs font-bold text-green-700 bg-green-50/20">${skCr}</td>
        `;
        tableBody.appendChild(row);
      }
    }

    function updateName(code, name) {
      if (accountRegistry[code]) {
        accountRegistry[code].name = name;
      }
    }

    document.getElementById('calcBtn').addEventListener('click', () => {
      const accType = accTypeEl.value;
      const accNum = accNumberEl.value.trim();

      const sn = parseFloat(document.getElementById('openingBalance').value.replace(/\s/g, '')) || 0;
      const debitOps = getValues(debitListEl);
      const creditOps = getValues(creditListEl);

      const od = debitOps.reduce((a, b) => a + b, 0);
      const ok = creditOps.reduce((a, b) => a + b, 0);
      const sk = accType === 'active' ? sn + od - ok : sn + ok - od;

      saveToRegistry(accNum, accType, sn, od, ok, sk);

      renderResult(accType, accNum, sn, debitOps, creditOps, od, ok, sk);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      accTypeEl.value = 'active';
      accNumberEl.value = '';
      document.getElementById('openingBalance').value = '';
      debitListEl.innerHTML = '';
      creditListEl.innerHTML = '';
      resultSection.classList.add('hidden');
      addOperationRow('debit');
      addOperationRow('credit');
    });
  </script>
</body>
</html>
